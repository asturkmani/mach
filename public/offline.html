<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mach1 · Offline</title>
    <style>
      :root {
        --bg: #f2f0ec;
        --ink: #1c1b19;
        --muted: #69645d;
        --line: #d9d4cc;
        --accent: #ec4800;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171615;
          --ink: #ece8e2;
          --muted: #a39e97;
          --line: #393633;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        box-sizing: border-box;
      }
      main {
        max-width: 22rem;
      }
      svg {
        width: 44px;
        height: 44px;
        display: block;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 20px;
        font-weight: 500;
        margin: 0 0 6px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        font-size: 15px;
        color: var(--bg);
        background: var(--ink);
        border: 0;
        padding: 10px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 1024 1024" aria-hidden="true">
        <rect width="1024" height="1024" fill="#1c1b19" />
        <svg x="44" y="356" width="936" height="312" viewBox="0 0 78 26">
          <g>
            <path d="M73 13 Q56 6 30 1 M73 13 Q56 20 30 25" stroke="#fbfaf8" stroke-width="0.6" stroke-linecap="round" opacity="0.4" fill="none"/>
            <path d="M2 13.5 H11" stroke="#ec4800" stroke-width="1.6" stroke-linecap="round" opacity="0.45" fill="none"/>
            <path d="M14 12 L17 3 H22 L24 11 Z" fill="#c9581f"/>
            <path d="M13 14 L25 14 L22 16 L15 16 Z" fill="#b84f1b"/>
            <path d="M11 11 H52 C62 11 68 12 72 13.2 C68 14.6 62 16 52 16 H11 C10 16 10 11 11 11 Z" fill="#e8732a"/>
            <path d="M53 11.2 C56 10 59 10.2 61 11.6" stroke="#f6c39c" stroke-width="1.2" stroke-linecap="round" fill="none"/>
            <path d="M33 14.5 L46 14.5 L43 18.5 L36 18.5 Z" fill="#b84f1b"/>
          </g>
        </svg>
      </svg>
      <h1>You're offline</h1>
      <p>Mach1 needs a connection to load this. Your agents keep working in the meantime, and this page reloads when you're back.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
